<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Browser Kit Cloud</title>
    <style>
      :root{--bg:#081019;--panel:#0d1622;--panel2:#101d2b;--line:rgba(191,218,240,.12);--text:#eef6ff;--muted:#91a0b3;--cyan:#70d8ff;--good:#51d39c;--bad:#fb7c91;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{height:36px;border-radius:9px;padding:0 11px;border:1px solid var(--line);background:#142131;color:#dce8f4;font-size:12px;font-weight:700;cursor:pointer;transition:.15s transform,.15s background}button:hover:not(:disabled){background:#1a3045}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.5;cursor:not-allowed}.primary{border:0;background:var(--cyan);color:#06202c}.danger{color:#ffc5d0;border-color:rgba(251,124,145,.35);background:rgba(251,124,145,.08)}input,select{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:#09131f;color:var(--text);padding:0 10px;font-size:12px;outline:none}input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(112,216,255,.1)}.shell{min-height:100vh;display:grid;grid-template-columns:400px minmax(0,1fr)}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh}.head{padding:21px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#83e7ff,#35b9e4);color:#06131d;font-weight:900}.title{font-size:16px;font-weight:800;letter-spacing:-.03em}.kicker{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8190a4;margin-top:3px}.connection{display:flex;align-items:center;gap:8px;padding:10px;margin-top:17px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.12);font-size:12px;color:#b8c6d6}.dot{height:7px;width:7px;border-radius:50%;background:#748198}.dot.ready{background:var(--good);box-shadow:0 0 12px var(--good)}.connection strong{margin-left:auto;font:10px ui-monospace,monospace;color:#7790a7}.account{display:flex;gap:7px;align-items:center;margin-top:12px}.account span{flex:1;min-width:0;color:#a8b9ca;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account button{height:29px;font-size:11px;padding:0 8px}.controls{padding:19px 21px;overflow:auto;flex:1}.section{margin-bottom:20px}.label{font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#7e91a6;margin:0 0 9px}.box{padding:12px;border-radius:13px;background:#09131f;border:1px solid var(--line)}.row,.grid2,.grid3{display:flex;gap:8px}.row input{min-width:0}.grid2{display:grid;grid-template-columns:1fr 1fr;margin-top:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px}.note{padding:11px;border-radius:11px;border:1px solid rgba(112,216,255,.18);background:rgba(112,216,255,.055);color:#a9cce0;font-size:11px;line-height:1.5}.logs{border-top:1px solid var(--line);padding:16px 21px;min-height:250px;background:rgba(0,0,0,.12)}.logs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.loglist{display:grid;gap:7px;max-height:235px;overflow:auto}.log{padding:9px 10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025);border-radius:9px}.logtop{display:flex;justify-content:space-between;gap:10px;font:10px ui-monospace,monospace;letter-spacing:.08em}.success .logtop{color:var(--good)}.error .logtop{color:var(--bad)}.pending .logtop{color:#f0c867}.logmsg{font-size:11px;color:#a5b5c6;margin-top:4px}.stage{min-width:0;display:flex;flex-direction:column}.stage-head{height:75px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.stage-title{font-size:14px;font-weight:800}.open{color:#c8d7e7;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px}.viewport{padding:18px;flex:1}.browser-frame{height:calc(100vh - 111px);min-height:560px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:#0b151f;box-shadow:0 22px 60px rgba(0,0,0,.28)}iframe{height:100%;width:100%;border:0;background:#fff}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 0,rgba(112,216,255,.11),transparent 31%),linear-gradient(135deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,24px 24px}.empty h1{font-size:24px;letter-spacing:-.04em;margin:18px 0 8px}.empty p{max-width:390px;color:#8295aa;line-height:1.55;font-size:14px}.play{margin:auto;width:60px;height:60px;display:grid;place-items:center;border-radius:18px;border:1px solid rgba(112,216,255,.22);background:rgba(112,216,255,.06);color:var(--cyan);font-size:25px}.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(112,216,255,.13),transparent 34%)}.card{width:min(100%,540px);padding:29px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 30px 100px rgba(0,0,0,.35)}.card h1{margin:0;font-size:27px;letter-spacing:-.05em}.card p{color:#9badbe;font-size:13px;line-height:1.55}.stack{display:grid;gap:10px;margin-top:20px}.message{min-height:18px;color:#ffbdc9;font-size:12px}.settings{min-height:100vh;padding:42px max(22px,calc((100vw - 900px)/2));background:radial-gradient(circle at 50% 0,rgba(112,216,255,.1),transparent 34%)}.settings-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.settings h1{margin:0;font-size:28px;letter-spacing:-.05em}.settings p{color:#a1b0c0;line-height:1.55}.key-secret{margin-top:12px;border-radius:10px;border:1px solid rgba(112,216,255,.3);background:#06121b;padding:12px;color:#a9eaff;word-break:break-all;font:12px ui-monospace,monospace}.key-row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.key-row main{flex:1;min-width:0}.key-name{font-size:13px;font-weight:750}.key-meta{font:10px ui-monospace,monospace;color:#8b9bae;margin-top:4px}.scopes{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.scope{border:1px solid var(--line);border-radius:999px;padding:3px 6px;color:#b1c1d1;font:10px ui-monospace,monospace}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.check{font-size:12px;color:#bdcad7;display:flex;gap:6px;align-items:center}.check input{width:auto;height:auto}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{min-height:auto}.browser-frame{height:620px}.settings{padding:24px}.stage{min-height:620px}}
    </style>
  </head>
  <body><div id="root"></div>
    <script>
      const state={sessions:[],activeId:'',viewUrl:'',busy:false,user:null,status:null,apiUnavailable:false,retryDelayMs:3000,nextRetryAt:0};
      const $=id=>document.getElementById(id);
      const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      async function api(path,options={}){let response;try{response=await fetch(path,{headers:{'content-type':'application/json',...(options.headers||{})},...options})}catch(error){throw new Error('Browser Kit API is unreachable. Check the service endpoint and reload.',{cause:error})}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data?.error?.message||data?.message||`Request failed (${response.status})`);return data}
      function setApiUnavailable(error){state.apiUnavailable=true;state.nextRetryAt=Date.now()+state.retryDelayMs;state.retryDelayMs=Math.min(state.retryDelayMs*2,30000);const host=$('engine-host');if(host){host.textContent='API unreachable — retrying';host.title=error?.message||'Browser Kit API could not be reached'}}
      function setApiAvailable(){state.apiUnavailable=false;state.retryDelayMs=3000;state.nextRetryAt=0;const host=$('engine-host');if(host){host.textContent=state.status?.host||location.host;host.title='Browser Kit API connected'}}
      function route(){return location.pathname}
      function loginView(){document.title='Sign in · Browser Kit';$('root').innerHTML=`<main class="auth-page"><section class="card"><div class="brand"><div class="mark">▣</div><div><div class="title">Browser Kit Cloud</div><div class="kicker">Secure browser automation</div></div></div><h1 id="auth-title" style="margin-top:27px">Sign in to your cloud</h1><p id="auth-copy">Create and manage scoped API keys for the Browser Kit SDK.</p><form class="stack" id="auth-form"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" minlength="12" required><div class="message" id="auth-message"></div><button class="primary" id="auth-submit">Sign in</button></form><button style="margin-top:12px" id="auth-switch">Need an account? Register</button></section></main>`;let registering=false;const render=()=>{$('auth-title').textContent=registering?'Create your Browser Kit account':'Sign in to your cloud';$('auth-copy').textContent=registering?'Use a password of at least 12 characters. You can generate SDK keys after signing in.':'Create and manage scoped API keys for the Browser Kit SDK.';$('auth-submit').textContent=registering?'Create account':'Sign in';$('auth-switch').textContent=registering?'Already have an account? Sign in':'Need an account? Register';};$('auth-switch').onclick=()=>{registering=!registering;render()};$('auth-form').onsubmit=async event=>{event.preventDefault();const submit=$('auth-submit');submit.disabled=true;$('auth-message').textContent='';try{await api(registering?'/app/api/auth/register':'/app/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});location.assign('/app')}catch(error){$('auth-message').textContent=error.message}finally{submit.disabled=false}}}
      function settingsView(){document.title='Settings · Browser Kit';$('root').innerHTML=`<main class="settings"><div class="settings-head"><div><div class="brand"><div class="mark">▣</div><div><div class="title">Browser Kit Cloud</div><div class="kicker">Account settings</div></div></div><h1 style="margin-top:28px">SDK API keys</h1><p>Create a scoped key for your agent or service. The full secret is displayed only once; Browser Kit stores a verifier, not the plaintext key.</p></div><div class="row"><button id="back">← Console</button><button id="signout">Sign out</button></div></div><section class="card" style="width:100%;max-width:none"><div class="label">Create a key</div><form id="key-form"><div class="row"><input id="key-name" placeholder="Key name, e.g. nexus-agent" required><button class="primary">Create key</button></div><div class="checks"><label class="check"><input type="checkbox" value="sessions:read" checked>sessions:read</label><label class="check"><input type="checkbox" value="sessions:control" checked>sessions:control</label><label class="check"><input type="checkbox" value="sessions:view" checked>sessions:view</label><label class="check"><input type="checkbox" value="sessions:close" checked>sessions:close</label></div></form><div id="key-secret-wrap" hidden><p><b>Copy this secret now.</b> It will not be shown again.</p><div class="key-secret" id="key-secret"></div><button id="copy-key" style="margin-top:9px">Copy key</button></div></section><section class="card" style="width:100%;max-width:none;margin-top:16px"><div class="label">Your keys</div><div id="key-list" class="empty" style="min-height:120px">Loading keys…</div></section></main>`;$('back').onclick=()=>location.assign('/app');$('signout').onclick=logout;$('key-form').onsubmit=createKey;loadKeys()}
      async function createKey(event){event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;try{const scopes=[...document.querySelectorAll('#key-form input[type=checkbox]:checked')].map(input=>input.value);const data=await api('/app/api/api-keys',{method:'POST',body:JSON.stringify({name:$('key-name').value,scopes})});$('key-secret').textContent=data.key;$('key-secret-wrap').hidden=false;$('key-name').value='';await loadKeys()}catch(error){alert(error.message)}finally{button.disabled=false}}
      async function loadKeys(){try{const data=await api('/app/api/api-keys');const keys=data.data||[];$('key-list').className='';$('key-list').innerHTML=keys.length?keys.map(key=>`<div class="key-row"><main><div class="key-name">${esc(key.name)}</div><div class="key-meta">${esc(key.prefix)} · created ${new Date(key.createdAt).toLocaleString()}${key.lastUsedAt?` · last used ${new Date(key.lastUsedAt).toLocaleString()}`:''}</div><div class="scopes">${key.scopes.map(scope=>`<span class="scope">${esc(scope)}</span>`).join('')}</div></main>${key.revokedAt?'<span class="scope">revoked</span>':`<button class="danger" data-revoke="${esc(key.id)}">Revoke</button>`}</div>`).join(''):'<div class="empty">No SDK keys created yet.</div>';document.querySelectorAll('[data-revoke]').forEach(button=>button.onclick=async()=>{if(!confirm('Revoke this API key immediately?'))return;await api('/app/api/api-keys/'+encodeURIComponent(button.dataset.revoke)+'/revoke',{method:'POST',body:'{}'});await loadKeys()})}catch(error){$('key-list').textContent=error.message}}
      async function logout(){try{await api('/app/api/auth/logout',{method:'POST',body:'{}'})}finally{location.assign('/app/login')}}
      function consoleView(){document.title='Browser Kit Control Console';$('root').innerHTML=`<div class="shell"><aside class="sidebar"><header class="head"><div class="brand"><div class="mark">▣</div><div><div class="title">Browser Kit</div><div class="kicker">Control console</div></div><div class="status"><span class="dot" id="status-dot"></span><span id="session-status">idle</span></div></div><div class="connection"><span>◉</span><span id="engine-host">checking cloud…</span><strong id="engine-security">secured</strong></div><div class="account"><span>${esc(state.user?.email||'Local operator')}</span><button id="settings">Settings</button><button id="logout">Sign out</button></div></header><main class="controls"><section class="section"><p class="label">Session</p><div class="box"><div class="row"><select id="session-select"><option value="">No active session</option></select><button id="refresh-view">↻</button></div><div class="grid2"><button id="start" class="primary">＋ Start session</button><button id="close" class="danger">□ Close</button></div></div></section><section class="section"><p class="label">Navigation</p><form id="navigate-form" class="row"><input id="url" value="https://example.com" placeholder="https://example.com"><button class="primary">Go</button></form><div class="grid3"><button data-command="back">← Back</button><button data-command="forward">→ Forward</button><button data-command="reload">↻ Reload</button></div></section><section class="section"><p class="label">Quick actions</p><div class="grid2"><button data-command="observe">◉ Observe</button><button data-command="screenshot">▣ Screenshot</button></div></section><div class="note"><b>Cloud-issued credentials.</b> Generate a scoped SDK key in Settings. Browser Kit validates it server-side and attributes sessions to your cloud account.</div></main><section class="logs"><div class="logs-head"><p class="label" style="margin:0">Live action log</p><span class="kicker" id="log-count">0 events</span></div><div class="loglist" id="logs"><div class="empty">Commands will appear here in real time.</div></div></section></aside><section class="stage"><header class="stage-head"><div><div class="kicker">Interactive browser</div><div class="stage-title" id="stage-title">No Chrome session</div></div><a class="open" id="open-view" hidden target="_blank" rel="noreferrer">↗ Open view</a></header><div class="viewport"><div class="browser-frame"><div class="empty" id="empty-stage"><div><div class="play">▷</div><h1>Launch remote Chrome</h1><p>Start an isolated browser session. The cloud-minted live view appears here for direct interaction.</p><button id="start-stage" class="primary">＋ Start session</button></div></div><iframe id="browser" title="Live remote Chrome" hidden allow="clipboard-read;clipboard-write;fullscreen" sandbox="allow-same-origin allow-scripts allow-forms allow-downloads"></iframe></div></div></section></div>`;bindConsole();refreshAll()}
      const selected=()=>state.sessions.find(session=>session.id===state.activeId);
      function setBusy(value){state.busy=value;document.querySelectorAll('button').forEach(button=>button.disabled=value||(button.id==='close'&&!state.activeId))}
      function renderSessions(){const select=$('session-select');select.innerHTML='<option value="">No active session</option>'+state.sessions.map(session=>`<option value="${esc(session.id)}">${esc(session.id.slice(0,8))} · ${esc(session.status)}</option>`).join('');if(state.activeId)select.value=state.activeId;const session=selected();$('session-status').textContent=session?.status||'idle';$('status-dot').className='dot '+(session?.status==='ready'||session?.status==='running'?'ready':'');$('stage-title').textContent=session?`Chrome session · ${session.id.slice(0,12)}`:'No Chrome session'}
      function renderView(){const iframe=$('browser'),empty=$('empty-stage'),open=$('open-view');iframe.hidden=!state.viewUrl;empty.hidden=Boolean(state.viewUrl);open.hidden=!state.viewUrl;if(state.viewUrl){iframe.src=state.viewUrl;open.href=state.viewUrl}}
      function renderLogs(items){$('log-count').textContent=`${items.length} events`;$('logs').innerHTML=items.length?items.map(item=>`<div class="log ${esc(item.status)}"><div class="logtop"><span>${esc(item.command)}</span><span>${item.durationMs!==undefined?`${item.durationMs}ms`:new Date(item.at).toLocaleTimeString()}</span></div><div class="logmsg">${esc(item.summary)}</div></div>`).join(''):'<div class="empty">Commands will appear here in real time.</div>'}
      async function refreshSessions(){const data=await api('/app/api/sessions');state.sessions=data.data||[];if(!state.activeId&&state.sessions[0])state.activeId=state.sessions[0].id;if(state.activeId&&!selected()){state.activeId=state.sessions[0]?.id||'';state.viewUrl='';renderView()}renderSessions()}
      async function refreshLogs(){const suffix=state.activeId?`?sessionId=${encodeURIComponent(state.activeId)}`:'';renderLogs((await api('/app/api/action-log'+suffix)).data||[])}
      async function loadView(){if(!state.activeId)return;const view=await api('/app/api/sessions/'+encodeURIComponent(state.activeId)+'/live-view',{method:'POST',body:JSON.stringify({mode:'readwrite'})});state.viewUrl=view.url;renderView()}
      async function start(){setBusy(true);try{const session=await api('/app/api/sessions',{method:'POST',body:'{}'});state.activeId=session.id;await refreshSessions();await loadView();await refreshLogs();setApiAvailable()}catch(error){setApiUnavailable(error);alert(error.message)}finally{setBusy(false)}}
      async function close(){if(!state.activeId)return;setBusy(true);try{await api('/app/api/sessions/'+encodeURIComponent(state.activeId)+'/close',{method:'POST',body:'{}'});state.activeId='';state.viewUrl='';renderView();await refreshAll();setApiAvailable()}catch(error){setApiUnavailable(error);alert(error.message)}finally{setBusy(false)}}
      async function command(type){if(!state.activeId)return alert('Start a Chrome session first.');const command=type==='navigate'?{type,url:$('url').value.trim()}:{type};if(type==='navigate'&&!command.url)return;setBusy(true);try{const result=await api('/app/api/sessions/'+encodeURIComponent(state.activeId)+'/commands',{method:'POST',body:JSON.stringify({command})});if(!result.ok)throw new Error(result.error?.message||'Browser command failed');if(['navigate','reload','back','forward'].includes(type))await loadView();await refreshLogs();setApiAvailable()}catch(error){setApiUnavailable(error);alert(error.message);try{await refreshLogs()}catch(refreshError){setApiUnavailable(refreshError)}}finally{setBusy(false)}}
      function bindConsole(){$('start').onclick=start;$('start-stage').onclick=start;$('close').onclick=close;$('refresh-view').onclick=()=>loadView().catch(error=>{setApiUnavailable(error);alert(error.message)});$('settings').onclick=()=>location.assign('/app/settings');$('logout').onclick=logout;$('session-select').onchange=event=>{state.activeId=event.target.value;state.viewUrl='';renderView();renderSessions();void refreshLogs().catch(error=>setApiUnavailable(error))};$('navigate-form').onsubmit=event=>{event.preventDefault();void command('navigate')};document.querySelectorAll('[data-command]').forEach(button=>button.onclick=()=>void command(button.dataset.command))}
      async function refreshAll(){if(state.apiUnavailable&&Date.now()<state.nextRetryAt)return;try{await refreshSessions();await refreshLogs();setApiAvailable()}catch(error){setApiUnavailable(error);console.warn('Browser Kit console refresh failed',error)}}
      async function boot(){try{state.status=await api('/app/api/status');const me=await api('/app/api/auth/me');if(state.status.cloudAuthRequired&&!me.authenticated){if(route()!='/app/login')return location.assign('/app/login');return loginView()}state.user=me.user||{email:'Local operator'};if(route()==='/app/login')return location.assign('/app');if(route()==='/app/settings')return settingsView();consoleView();$('engine-host').textContent=state.status.host;$('engine-security').textContent=state.status.protected?'secured':'local';setInterval(()=>refreshAll(),3000)}catch(error){$('root').innerHTML=`<main class="auth-page"><section class="card"><h1>Browser Kit unavailable</h1><p>${esc(error.message)}</p></section></main>`;console.error(error)}}
      boot();
    </script>
  </body>
</html>
